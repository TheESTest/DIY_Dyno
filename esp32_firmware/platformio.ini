; DIY Engine Dyno — ESP32-S3 Firmware
; Communicates with Raspberry Pi 5 via USB Serial.
;
; https://docs.platformio.org/page/projectconf.html

; Two build targets:
;   esp32-s3-devkitc-1      -> LIVE. Real sensors. This is what goes on the dyno.
;   esp32-s3-devkitc-1-sim  -> SIM. Virtual engine for bench demos, no engine
;                              needed. Prints a loud banner and reports sim=1
;                              in its READY line so the GUI can flag it.
; SIM is never the default: a board that boots into SIM looks exactly like a
; working system while every reading on screen is synthetic.

[env:esp32-s3-devkitc-1]
platform = espressif32
board = esp32-s3-devkitc-1
framework = arduino
monitor_speed = 115200
; Serial routed to UART0 (CP2102N bridge -> /dev/ttyUSB0 on the Pi), NOT the
; native-USB port. Set to 1 only if you connect the ESP's native "USB" port.
build_flags =
  -DARDUINO_USB_CDC_ON_BOOT=0
  -DBOARD_HAS_PSRAM
  -DSIM_MODE_DEFAULT=0
board_build.arduino.memory_type = opi_opi
board_build.flash_mode = opi
board_build.partitions = partitions.csv

lib_deps =
  adafruit/Adafruit BusIO
  https://github.com/DFRobot/DFRobot_ADS1115_0_10V.git
  adafruit/Adafruit ADS1X15@^2.4.0
  waspinator/AccelStepper@^1.64

[env:esp32-s3-devkitc-1-sim]
extends = env:esp32-s3-devkitc-1
build_flags =
  -DARDUINO_USB_CDC_ON_BOOT=0
  -DBOARD_HAS_PSRAM
  -DSIM_MODE_DEFAULT=1

